# ===========================
# Application
# ===========================
spring.application.name=notification-service
server.port=8090

# ===========================
# Database (Docker)
# ===========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/mindfocus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===========================
# RabbitMQ (Docker)
# ===========================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.ssl.enabled=false

# ===========================
# MindFocus RabbitMQ Config
# ===========================
mindfocus.rabbitmq.exchange=mindfocus.event.exchange

mindfocus.rabbitmq.queues.notification-events=mindfocus.notification.queue
mindfocus.rabbitmq.routing-keys.notification=habito.criado

mindfocus.rabbitmq.queues.listener-habito=habito.criado.listener.queue
mindfocus.rabbitmq.routing-keys.habito-criado=habito.criado

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# ===========================
# JWT
# ===========================
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:mindfocus-backend}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===========================
# Logging
# ===========================
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.amqp=DEBUG
