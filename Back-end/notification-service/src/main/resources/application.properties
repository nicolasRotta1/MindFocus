# ===========================
# Notification service — configuração por ambiente (ver infra/.env.example)
# ===========================
spring.application.name=notification-service
server.port=8090

# ===========================
# Database (partilhado com habito-service — documentar ownership das tabelas no README)
# ===========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mindfocus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===========================
# RabbitMQ
# ===========================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}

mindfocus.rabbitmq.exchange=mindfocus.event.exchange
mindfocus.rabbitmq.queues.listener-habito=habito.criado.listener.queue
mindfocus.rabbitmq.routing-keys.habito-criado=habito.criado

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# ===========================
# JWT
# ===========================
jwt.secret=${JWT_SECRET:mindfocus-local-dev-only-change-in-env-min-32-chars}
jwt.issuer=${JWT_ISSUER:mindfocus-backend}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===========================
# Actuator
# ===========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# ===========================
# Logging
# ===========================
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.amqp=INFO
