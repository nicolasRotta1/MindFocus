# Testes sem MySQL/Rabbit reais
spring.datasource.url=jdbc:h2:mem:notification_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

spring.flyway.enabled=false

jwt.secret=mindfocus-test-jwt-secret-minimum-32-characters
jwt.issuer=mindfocus-test
